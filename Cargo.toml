[package]
name = "turso-mappers"
version = "0.3.0"
edition = "2024"
description = "Row mappers for turso"
license = "MIT"
repository = "https://github.com/stevewillcock/turso-mappers"


[dependencies]
turso = "0.5.0"
turso-mappers-derive = { version = "0.3.0", path = "turso-mappers-derive" }


[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros", "test-util", "rt-multi-thread"] }
